name: Deploy to GitHub Pages

# Publishes the whole static site to GitHub Pages:
#   - the playable game at the site root (index.html)
#   - the design document at /docs/design.html
# Deploys on every push to the repository's default branch, or on manual dispatch.

on:
  push:
    branches: ["claude/plan-review-html-adapt-qwnx5y"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stamp asset version (cache-busting)
        # Replace the ?v=DEV placeholder on every css/js URL with a unique value per deploy,
        # so browsers (incl. iOS Safari / home-screen apps) always fetch the newest files.
        run: |
          V="${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          sed -i "s/?v=DEV/?v=${V}/g" index.html
          echo "Stamped assets with ?v=${V}"
          grep -o 'main.js?v=[^"]*' index.html || true
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically (uses the workflow token) so no manual
          # Settings -> Pages step is needed for the first deploy.
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repository root as-is (no build step). .git and .github are
          # ignored by the upload action.
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
